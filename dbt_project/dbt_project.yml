# ==============================================================================
# dbt_project.yml - Configurações Principais do Projeto dbt CineLake
# ==============================================================================
name: 'cinelake'
version: '1.0.0'
config-version: 2

# Diretórios onde o dbt busca os diferentes componentes do projeto
model-paths: ["models"]        # Modelos SQL de transformação
analysis-paths: ["analyses"]   # Análises ad-hoc que não criam tabelas/views
test-paths: ["tests"]          # Testes de dados customizados (singular tests)
seed-paths: ["seeds"]          # Arquivos CSV estáticos carregados pelo dbt
macro-paths: ["macros"]        # Funções/macros Jinja reutilizáveis
snapshot-paths: ["snapshots"]  # Capturas para Slowly Changing Dimensions (SCD Type 2)

# Diretório de compilação e artefatos gerados
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configurações globais de materialização por camada de dados
models:
  cinelake:
    # Camada Staging: Limpeza, padronização e tipagem dos dados brutos (views)
    staging:
      +materialized: view
      +schema: staging
    # Camada Marts: Modelos analíticos e de negócio prontos para consumo (tabelas)
    marts:
      +materialized: table
      +schema: marts