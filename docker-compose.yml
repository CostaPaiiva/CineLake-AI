# Definição dos serviços (containers) que serão executados
services:
  # Serviço principal da API FastAPI
  api:
    image: ghcr.io/CostaPaiiva/cinelake-ai:latest
    container_name: cinelake-api
    restart: unless-stopped
    environment:
      CINELAKE_ENV: production
      CINELAKE_LOG_LEVEL: INFO
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      - cinelake-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  # Serviço do banco de dados PostgreSQL
  postgres:
    # Imagem PostgreSQL 16 com extensão pgvector pré-instalada para busca vetorial
    image: pgvector/pgvector:pg16
    # Nome do container quando estiver em execução
    container_name: cinelake-postgres
    # Reinicia o container automaticamente caso ele caia, a menos que seja parado manualmente
    restart: unless-stopped
    # Variáveis de ambiente carregadas do arquivo .env para configurar o banco de dados
    environment:
      POSTGRES_USER: ${POSTGRES_USER}          # Nome do usuário administrador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Senha do usuário administrador
      POSTGRES_DB: ${POSTGRES_DB}              # Nome do banco de dados padrão
    # Mapeamento de portas (libera a porta 5432 apenas para o localhost/máquina local)
    ports:
      - "127.0.0.1:5432:5432"
    # Mapeamento de volumes persistentes para não perder os dados do banco ao reiniciar
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Rede em que o container irá rodar (permite comunicação direta com outros containers na mesma rede)
    networks:
      - cinelake-network
    # Verificação de integridade (Healthcheck) para garantir que o banco está pronto para conexões
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Limitação de recursos de hardware para evitar consumo excessivo da VPS
    deploy:
      resources:
        limits:
          cpus: "1.0"   # Limita o uso a no máximo 1 núcleo de CPU
          memory: 1G    # Limita o uso a no máximo 1 Gigabyte de memória RAM

  # Serviço do MinIO (Object Storage compatível com a API do AWS S3)
  minio:
    # Imagem oficial mais recente do MinIO
    image: minio/minio:latest
    # Nome do container quando estiver em execução
    container_name: cinelake-minio
    # Reinicia o container automaticamente caso ele caia, a menos que seja parado manualmente
    restart: unless-stopped
    # Variáveis de ambiente carregadas do arquivo .env para as credenciais do MinIO
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}      # Chave de acesso root
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}  # Chave secreta de acesso root
    # Mapeamento de portas (libera portas para a API e para o painel web apenas localmente)
    ports:
      - "127.0.0.1:9000:9000"  # Porta da API do S3
      - "127.0.0.1:9001:9001"  # Porta do painel de administração (console)
    # Mapeamento de volumes persistentes para salvar os arquivos do MinIO
    volumes:
      - minio_data:/data
    # Rede de comunicação
    networks:
      - cinelake-network
    # Comando de inicialização do servidor MinIO definindo a porta do console web
    command: server /data --console-address ":9001"
    # Verificação de integridade para checar se o MinIO está ativo e respondendo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Limitação de recursos de hardware
    deploy:
      resources:
        limits:
          cpus: "1.0"   # Limita o uso a no máximo 1 núcleo de CPU
          memory: 1G    # Limita o uso a no máximo 1 Gigabyte de memória RAM

  # Serviço do MLflow para rastreamento de experimentos e registro de modelos de ML
  mlflow:
    # Imagem docker oficial do MLflow mantida no GitHub Container Registry
    image: ghcr.io/mlflow/mlflow:latest
    # Nome do container quando estiver em execução
    container_name: cinelake-mlflow
    # Reinicia o container automaticamente caso ele caia, a menos que seja parado manualmente
    restart: unless-stopped
    # Variáveis de ambiente de configuração do MLflow e autenticação de armazenamento de artefatos
    environment:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000  # URL base de rastreamento do servidor MLflow
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}      # Chave de acesso S3 obtida das variáveis do MinIO
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}  # Chave secreta S3 obtida das variáveis do MinIO
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000   # URL do endpoint S3 apontando para o container minio
      MLFLOW_S3_IGNORE_TLS: "true"                # Ignora validação de certificados TLS (conexão HTTP sem SSL)
    # Mapeamento de portas (libera a porta 5000 apenas para o localhost/máquina local)
    ports:
      - "127.0.0.1:5000:5000"
    # Rede em que o container irá rodar (permite comunicação com postgres e minio)
    networks:
      - cinelake-network
    # Comando de inicialização do servidor MLflow com backend PostgreSQL e artefatos no MinIO S3
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://mlflow-artifacts
      --host 0.0.0.0
      --port 5000
    # Garante que o MLflow só iniciará após os serviços do PostgreSQL e MinIO estarem saudáveis (healthy)
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Serviço de cache e armazenamento em memória Redis
  redis:
    # Imagem oficial leve do Redis baseada em Alpine Linux
    image: redis:7-alpine
    # Nome do container em execução
    container_name: cinelake-redis
    # Reinicia o container automaticamente em caso de queda
    restart: unless-stopped
    # Mapeia a porta padrão 6379 apenas para acesso local (localhost)
    ports:
      - "127.0.0.1:6379:6379"
    # Associa o container à rede interna cinelake-network
    networks:
      - cinelake-network
    # Teste de saúde checando a resposta ao comando ping do redis-cli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Limitação dos recursos de hardware alocados ao container
    deploy:
      resources:
        limits:
          cpus: "0.5"   # Limita a 0,5 núcleos de CPU
          memory: 512M  # Limita a 512 Megabytes de memória RAM

  # Serviço do Node Exporter para coleta de métricas de hardware e do sistema operacional host
  node-exporter:
    # Imagem Docker oficial do Prometheus Node Exporter
    image: prom/node-exporter:latest
    # Nome do container quando estiver em execução
    container_name: cinelake-node-exporter
    # Reinicia o container automaticamente caso ele caia, a menos que seja parado manualmente
    restart: unless-stopped
    # Mapeamento dos diretórios do sistema host em modo somente leitura (ro) para leitura de métricas
    volumes:
      # Mapeia o sistema de arquivos de processos /proc do host
      - /proc:/host/proc:ro
      # Mapeia o sistema de arquivos do kernel /sys do host
      - /sys:/host/sys:ro
      # Mapeia o sistema de arquivos raiz / do host
      - /:/rootfs:ro
    # Parâmetros de linha de comando informando os caminhos dos sistemas de arquivos mapeados
    command:
      # Informa o caminho do procfs mapeado no container
      - '--path.procfs=/host/proc'
      # Informa o caminho do sysfs mapeado no container
      - '--path.sysfs=/host/sys'
      # Informa o caminho do rootfs mapeado no container
      - '--path.rootfs=/rootfs'
    # Mapeamento de portas (libera a porta 9100 apenas para o localhost)
    ports:
      # Porta 9100 exposta localmente para métricas de infraestrutura
      - "127.0.0.1:9100:9100"
    # Rede de comunicação em que o container irá rodar
    networks:
      # Associa à rede cinelake-network
      - cinelake-network

  # Serviço do Postgres Exporter para coleta de métricas do banco de dados PostgreSQL
  postgres-exporter:
    # Imagem Docker oficial da comunidade Prometheus para o exportador do PostgreSQL
    image: prometheuscommunity/postgres-exporter:latest
    # Nome do container quando estiver em execução
    container_name: cinelake-postgres-exporter
    # Reinicia o container automaticamente caso ele caia, a menos que seja parado manualmente
    restart: unless-stopped
    # Variáveis de ambiente de conexão com o banco de dados
    environment:
      # String de conexão do PostgreSQL formatada com credenciais do ambiente e SSL desabilitado
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    # Mapeamento de portas (libera a porta 9187 apenas para o localhost)
    ports:
      # Porta 9187 exposta localmente para métricas do banco
      - "127.0.0.1:9187:9187"
    # Rede de comunicação em que o container irá rodar
    networks:
      # Associa à rede cinelake-network
      - cinelake-network
    # Depende da inicialização saudável do serviço PostgreSQL
    depends_on:
      # Nome do serviço dependente
      postgres:
        # Condição de dependência exigindo estado de saúde (service_healthy)
        condition: service_healthy

  # Serviço do Prometheus para armazenamento e consulta de séries temporais de métricas
  prometheus:
    # Imagem Docker oficial mais recente do Prometheus
    image: prom/prometheus:latest
    # Nome do container quando estiver em execução
    container_name: cinelake-prometheus
    # Reinicia o container automaticamente caso ele caia, a menos que seja parado manualmente
    restart: unless-stopped
    # Mapeamento dos arquivos de configuração e volume de persistência de dados do Prometheus
    volumes:
      # Mapeia o arquivo de configuração local do Prometheus para o diretório interno
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Mapeia o volume persistente nomeado para armazenar as métricas em disco
      - prometheus_data:/prometheus
    # Comando de inicialização configurando o arquivo de parâmetros e diretório TSDB
    command:
      # Parâmetro para localização do arquivo de configuração yaml
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Parâmetro para o diretório de dados das séries temporais
      - '--storage.tsdb.path=/prometheus'
    # Mapeamento de portas (expõe a porta 9090 apenas para o localhost)
    ports:
      # Porta 9090 exposta localmente para a interface web e API do Prometheus
      - "127.0.0.1:9090:9090"
    # Rede de comunicação interna dos containers
    networks:
      # Associa à rede cinelake-network
      - cinelake-network
    # Dependências de inicialização para que o Prometheus inicie após os exportadores
    depends_on:
      # Depende do serviço node-exporter
      node-exporter:
        # Condição exigindo que o serviço node-exporter esteja iniciado
        condition: service_started
      # Depende do serviço postgres-exporter
      postgres-exporter:
        # Condição exigindo que o serviço postgres-exporter esteja iniciado
        condition: service_started

  # Serviço do Grafana para visualização, dashboards e monitoramento
  grafana:
    # Imagem Docker oficial mais recente do Grafana
    image: grafana/grafana:latest
    # Nome do container quando estiver em execução
    container_name: cinelake-grafana
    # Reinicia o container automaticamente caso ele caia, a menos que seja parado manualmente
    restart: unless-stopped
    # Configurações de ambiente para credenciais administrativas e acesso
    environment:
      # Senha do administrador obtida da variável de ambiente com valor fallback 'admin'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Desativa a permissão de auto-cadastro para novos usuários no Grafana
      GF_USERS_ALLOW_SIGN_UP: "false"
    # Mapeamento de portas (expõe a porta 3000 apenas para o localhost)
    ports:
      # Porta 3000 exposta localmente para a interface web do Grafana
      - "127.0.0.1:3000:3000"
    # Mapeamento de volumes para dados persistentes do Grafana e provisionamento
    volumes:
      # Volume persistente para salvar dashboards, usuários e configurações
      - grafana_data:/var/lib/grafana
      # Mapeamento da pasta local de provisionamento automático do Grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    # Rede de comunicação interna dos containers
    networks:
      # Associa à rede cinelake-network
      - cinelake-network
    # Depende da inicialização prévia do serviço Prometheus
    depends_on:
      # Nome do serviço dependente
      prometheus:
        # Condição exigindo que o serviço prometheus esteja iniciado
        condition: service_started

  # Serviço do Apache ZooKeeper para coordenação de cluster do Kafka
  zookeeper:
    # Imagem oficial da Confluent para o ZooKeeper
    image: confluentinc/cp-zookeeper:7.6.0
    # Nome do container em execução
    container_name: cinelake-zookeeper
    # Reinicia o container automaticamente caso ocorra alguma falha
    restart: unless-stopped
    # Variáveis de ambiente de configuração das portas e ticks do cliente ZooKeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181  # Porta de escuta para clientes do ZooKeeper
      ZOOKEEPER_TICK_TIME: 2000    # Unidade básica de tempo em milissegundos utilizada pelo ZooKeeper
    # Mapeamento de portas (libera a porta 2181 localmente)
    ports:
      - "127.0.0.1:2181:2181"
    # Rede de comunicação dos containers do projeto
    networks:
      - cinelake-network
    # Teste de integridade checando se o serviço respondeu com 'imok' ao comando 'ruok'
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serviço do Apache Kafka para mensageria distribuída e streaming de eventos em tempo real
  kafka:
    # Imagem oficial da Confluent para o Apache Kafka Broker
    image: confluentinc/cp-kafka:7.6.0
    # Nome do container em execução
    container_name: cinelake-kafka
    # Reinicia o container automaticamente caso ele caia
    restart: unless-stopped
    # Depende da inicialização saudável do serviço ZooKeeper
    depends_on:
      zookeeper:
        condition: service_healthy
    # Variáveis de ambiente para parametrização do broker Kafka
    environment:
      KAFKA_BROKER_ID: 1                                         # Identificador único do broker no cluster Kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181                   # Endereço de conexão com o cluster ZooKeeper
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092    # Endereço exposto para conexões dos clientes produtores/consumidores
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1                 # Fator de replicação para tópicos de offsets internos
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1         # Fator de replicação para o log de transações
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1                    # Mínimo de réplicas em sincronia para transações
      KAFKA_LOG_RETENTION_HOURS: 168                            # Tempo de retenção das mensagens em disco (168h = 7 dias)
    # Mapeamento da porta 9092 apenas para acesso local
    ports:
      - "127.0.0.1:9092:9092"
    # Rede de comunicação dos containers
    networks:
      - cinelake-network
    # Verificação de integridade listando tópicos através da ferramenta de CLI do Kafka
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

# Definição dos volumes persistentes nomeados
volumes:
  # Volume para persistência dos dados do PostgreSQL
  pgdata:
    # Nome do volume gerenciado pelo Docker para o banco de dados
    name: cinelake_pgdata
  # Volume para persistência dos arquivos e artefatos do MinIO
  minio_data:
    # Nome do volume gerenciado pelo Docker para o armazenamento de arquivos MinIO
    name: cinelake_minio_data
  # Volume para persistência do banco de séries temporais do Prometheus
  prometheus_data:
    # Nome do volume gerenciado pelo Docker para o banco de dados do Prometheus
    name: cinelake_prometheus_data
  # Volume para persistência dos dados, dashboards e sessões do Grafana
  grafana_data:
    # Nome do volume gerenciado pelo Docker para as configurações do Grafana
    name: cinelake_grafana_data

# Definição de redes personalizadas
networks:
  # Rede interna dos containers da aplicação CineLake
  cinelake-network:
    # Nome da rede criada no Docker
    name: cinelake-network
    # Driver de rede do tipo bridge para comunicação entre containers na mesma máquina
    driver: bridge