[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinelake-ai"
version = "0.1.0"
description = "Production-Grade Data Engineering, Recommendation & Agentic Data Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Seu Nome", email = "seu-email@example.com" }
]
dependencies = [
    "python-dotenv>=1.0.0",  # Gerenciamento de variáveis de ambiente (.env)
    "sqlalchemy>=2.0",       # ORM e abstração de banco de dados SQL
    "psycopg[binary]>=3.1",  # Driver PostgreSQL de alta performance (psycopg3)
    "alembic>=1.13",         # Controle de versões e migrações do schema do banco
    "boto3>=1.34",           # SDK AWS para interação com S3 / Lakehouse
    "pyarrow>=15.0",         # Processamento e manipulação de arquivos Parquet em memória
    "pandas>=2.0",           # Manipulação e análise tabular de dados
    "dbt-core>=1.8",         # Motor de transformação de dados e modelagem analítica
    "dbt-postgres>=1.8",     # Adaptador dbt para bancos de dados PostgreSQL
    "great_expectations>=0.18",  # Framework de validação, testes e contratos de qualidade de dados
    "prometheus_client>=0.18",   # Cliente para exportação e coleta de métricas de observabilidade
    "python-json-logger>=2.0",   # Formatação de logs da aplicação em estrutura JSON
    "fastapi>=0.110",            # Framework web assíncrono para construção de APIs REST de alta performance
    "uvicorn>=0.27",             # Servidor de aplicação ASGI de alta velocidade para Python
    "mcp>=1.0",                  # SDK do Model Context Protocol para integração com agentes de IA
    "sentence-transformers>=2.7", # Modelo de aprendizado de máquina para geração de embeddings vetoriais RAG
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.10"
]

[project.scripts]
cinelake = "cinelake.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cinelake"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]