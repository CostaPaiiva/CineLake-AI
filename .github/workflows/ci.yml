name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  typecheck:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: mypy src

  unit-tests:
    name: Unit Tests (Pytest + Coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Rodar testes com cobertura
        run: pytest tests/unit -v --cov=src/cinelake --cov-report=xml --cov-report=term-missing
      - name: Publicar cobertura como artefato
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinelake
          POSTGRES_PASSWORD: cinelake_password
          POSTGRES_DB: cinelake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinelake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: cinelake_minio
          MINIO_ROOT_PASSWORD: cinelake_minio_secret
        ports:
          - 9000:9000
    env:
      POSTGRES_USER: cinelake
      POSTGRES_PASSWORD: cinelake_password
      POSTGRES_DB: cinelake
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg://cinelake:cinelake_password@127.0.0.1:5432/cinelake
      MINIO_ACCESS_KEY: cinelake_minio
      MINIO_SECRET_KEY: cinelake_minio_secret
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_BUCKET: data-lake
      MINIO_USE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Aplicar migrações
        run: alembic upgrade head
      - name: Rodar testes de integração
        run: pytest tests/integration -v -m integration

  dbt:
    name: dbt Compile & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinelake
          POSTGRES_PASSWORD: cinelake_password
          POSTGRES_DB: cinelake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinelake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: cinelake
      POSTGRES_PASSWORD: cinelake_password
      POSTGRES_DB: cinelake
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg://cinelake:cinelake_password@127.0.0.1:5432/cinelake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Aplicar migrações
        run: alembic upgrade head
      - name: dbt compile
        working-directory: dbt_project
        run: dbt compile --profiles-dir .
      - name: dbt run
        working-directory: dbt_project
        run: dbt run --profiles-dir .
      - name: dbt test
        working-directory: dbt_project
        run: dbt test --profiles-dir .

  sqlfluff:
    name: SQLFluff
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinelake
          POSTGRES_PASSWORD: cinelake_password
          POSTGRES_DB: cinelake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinelake -d cinelake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: cinelake
      POSTGRES_PASSWORD: cinelake_password
      POSTGRES_DB: cinelake
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install sqlfluff sqlfluff-templater-dbt dbt-core dbt-postgres
      - name: Lint SQL do dbt
        working-directory: dbt_project
        run: sqlfluff lint models

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "setuptools>=83.0.0"
          pip install pip-audit
          pip install -e ".[dev]"
      - run: pip-audit

  docker-build:
    name: Docker Build + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagem
        run: docker build -t cinelake-ai:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cinelake-ai:ci
          format: table
          exit-code: "0"
          severity: "CRITICAL,HIGH"
