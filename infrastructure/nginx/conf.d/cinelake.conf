# Bloco de servidor HTTP (Porta 80)
# Redireciona HTTP para HTTPS (ajuste o domínio)
server {
    # Escuta conexões não criptografadas na porta 80
    listen 80;
    # Define o nome de domínio virtual atendido por este bloco de servidor
    server_name cinelake.seudominio.com;

    # Rota específica para renovação e validação de certificados SSL pelo Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        # Diretório raiz onde o Certbot grava os desafios temporários ACME
        root /var/www/certbot;
    }

    # Rota raiz que intercepta qualquer requisição HTTP e redireciona para HTTPS
    location / {
        # Retorna o código HTTP 301 (Permanent Redirect) forçando o uso de HTTPS
        return 301 https://$host$request_uri;
    }
}

# Bloco de servidor HTTPS seguro (Porta 443)
# API principal
server {
    # Escuta conexões criptografadas SSL/TLS na porta 443
    listen 443 ssl;
    # Define o nome de domínio virtual com suporte a SSL
    server_name cinelake.seudominio.com;

    # Caminho para o arquivo do certificado público SSL (incluindo a cadeia completa de certificados)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # Caminho para o arquivo da chave privada SSL correspondente
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Roteamento de requisições para a API Principal do CineLake AI
    location /api/ {
        # Aplica rate limiting com tolerância de pico de até 40 requisições sem atraso artificial (nodelay)
        limit_req zone=api_limit burst=40 nodelay;
        # Encaminha as requisições para o container interno da API principal na porta 8002
        proxy_pass http://api:8002/;
        # Repassa o cabeçalho Host original enviado pelo cliente
        proxy_set_header Host $host;
        # Repassa o endereço IP real do cliente para a aplicação backend
        proxy_set_header X-Real-IP $remote_addr;
        # Concatena os endereços de proxies anteriores no cabeçalho X-Forwarded-For
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Informa à aplicação qual protocolo original foi utilizado (http ou https)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Roteamento de requisições para o serviço do assistente RAG
    location /rag/ {
        # Encaminha o tráfego para a API do RAG na porta 8001
        proxy_pass http://api:8001/;
        # Repassa o cabeçalho Host original para a aplicação
        proxy_set_header Host $host;
    }

    # Roteamento de requisições para o servidor remoto de ferramentas MCP
    location /mcp/ {
        # Encaminha o tráfego para o servidor MCP na porta 8010
        proxy_pass http://api:8010/;
        # Repassa o cabeçalho Host original para a aplicação
        proxy_set_header Host $host;
    }

    # Roteamento de requisições para a interface de monitoramento do Grafana
    location /grafana/ {
        # Encaminha o tráfego para o container do Grafana na porta 3000
        proxy_pass http://grafana:3000/;
        # Repassa o cabeçalho Host original para a aplicação
        proxy_set_header Host $host;
    }

    # Roteamento de requisições para a interface e API de rastreamento do MLflow
    location /mlflow/ {
        # Encaminha o tráfego para o container do MLflow na porta 5000
        proxy_pass http://mlflow:5000/;
        # Repassa o cabeçalho Host original para a aplicação
        proxy_set_header Host $host;
    }
}
